spring.application.name=shippingservice

server.port=8084

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smartlogixshipments?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# URL of other microservices
app.orderservice.url=http://localhost:8083
