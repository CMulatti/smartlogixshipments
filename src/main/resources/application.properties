spring.application.name=shipmentservice

server.port=8084

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smartlogixshipments?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# URL of other microservices (we need to notify it when shipment status changes)
app.orderservice.url=http://localhost:8083


spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=shipment-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.smartlogix.shipmentservice.dto.OrderCreatedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false


